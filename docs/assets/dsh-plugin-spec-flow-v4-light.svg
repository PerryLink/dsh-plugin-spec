<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-plugin-spec clause-to-check matrix">
<defs>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1b1735" flood-opacity="0.10"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.3" cy="1.3" r="1.3" fill="#f2f0f8"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4B67B4"/>
  </marker>
</defs>
<rect width="1100" height="660" fill="#ffffff"/>
<rect width="1100" height="660" fill="url(#dots)" opacity=".5"/>
<text x="50" y="58" fill="#141419" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700">dsh-plugin-spec</text>
<text x="50" y="86" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">every clause has a check · the checker reads the repo, never edits it</text>
<text x="60" y="126" fill="#4B67B4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">CLAUSES</text>
<text x="640" y="126" fill="#16a34a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">CHECKS</text>

<rect x="50" y="148" width="440" height="104" rx="16" fill="#ffffff" stroke="#e6e3f0" filter="url(#soft)"/>
<text x="72" y="180" fill="#141419" font-family="ui-monospace, monospace" font-size="19" font-weight="700">ENTRY</text>
<text x="72" y="206" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">能装上、能跑、不崩</text>
<text x="72" y="232" fill="#8f94a4" font-family="ui-monospace, monospace" font-size="12">clauses/entry.md</text>
<rect x="610" y="148" width="440" height="104" rx="16" fill="#ffffff" stroke="#e6e3f0" filter="url(#soft)"/>
<text x="632" y="180" fill="#16a34a" font-family="ui-monospace, monospace" font-size="14" font-weight="700">contract + manifest</text>
<text x="632" y="206" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">--scope entry → one report entry</text>
<text x="632" y="232" fill="#8f94a4" font-family="ui-monospace, monospace" font-size="12">same id on both sides = the contract</text>
<line x1="496" y1="200" x2="604" y2="200" stroke="#4B67B4" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<rect x="50" y="276" width="440" height="104" rx="16" fill="#ffffff" stroke="#e6e3f0" filter="url(#soft)"/>
<text x="72" y="308" fill="#141419" font-family="ui-monospace, monospace" font-size="19" font-weight="700">FLOW</text>
<text x="72" y="334" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">日常任务顺、错误可恢复</text>
<text x="72" y="360" fill="#8f94a4" font-family="ui-monospace, monospace" font-size="12">clauses/flow.md</text>
<rect x="610" y="276" width="440" height="104" rx="16" fill="#ffffff" stroke="#e6e3f0" filter="url(#soft)"/>
<text x="632" y="308" fill="#16a34a" font-family="ui-monospace, monospace" font-size="14" font-weight="700">install + smoke</text>
<text x="632" y="334" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">--scope flow → one report entry</text>
<text x="632" y="360" fill="#8f94a4" font-family="ui-monospace, monospace" font-size="12">same id on both sides = the contract</text>
<line x1="496" y1="328" x2="604" y2="328" stroke="#4B67B4" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<rect x="50" y="404" width="440" height="104" rx="16" fill="#ffffff" stroke="#e6e3f0" filter="url(#soft)"/>
<text x="72" y="436" fill="#141419" font-family="ui-monospace, monospace" font-size="19" font-weight="700">BOOST</text>
<text x="72" y="462" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">提效证据可复现</text>
<text x="72" y="488" fill="#8f94a4" font-family="ui-monospace, monospace" font-size="12">clauses/boost.md</text>
<rect x="610" y="404" width="440" height="104" rx="16" fill="#ffffff" stroke="#e6e3f0" filter="url(#soft)"/>
<text x="632" y="436" fill="#16a34a" font-family="ui-monospace, monospace" font-size="14" font-weight="700">perf + evidence</text>
<text x="632" y="462" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">--scope boost → one report entry</text>
<text x="632" y="488" fill="#8f94a4" font-family="ui-monospace, monospace" font-size="12">same id on both sides = the contract</text>
<line x1="496" y1="456" x2="604" y2="456" stroke="#4B67B4" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<rect x="50" y="536" width="1000" height="52" rx="14" fill="#ffffff" stroke="#4B67B4" stroke-width="1.6"/>
<text x="74" y="558" fill="#4B67B4" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">$ dsh-plugin-verify --scope entry</text>
<text x="74" y="578" fill="#4d5261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">text / json / SARIF · report.json · exit 0 | 1 | 2 | 3</text>
<text x="50" y="618" fill="#4d5261" font-family="ui-monospace, monospace" font-size="12.5">CC-BY-4.0 / Apache-2.0 · PerryLink DSH plugin family</text>
</svg>
